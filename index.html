<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inscripción Turnos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    button {
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Inscripción de Familias</h2>
  <div id="tabla"></div>

  <script>
    const API = "https://script.google.com/macros/s/AKfycbwQVW4WVWYBTkYdg8SsbL-kTKXFlx6UQkwOtfzMCMbzFmHO97tn5KyK5CZdLlLuEW7z/exec";
    const MAX_FAMILIAS = 3;
    const ACTIVIDAD = "Bingo";

    const COMISIONES = [
      "Seguridad",
      "Caja",
      "Tómbola",
      "Comida"
    ];

    const TURNOS = [
      "09:00-12:00",
      "12:00-15:00",
      "15:00-18:00"
    ];

    async function cargar() {
      try {
        const respuesta = await fetch(API);
        const registros = await respuesta.json();
        dibujar(registros);
      } catch (error) {
        console.error("Error al cargar los datos:", error);
      }
    }

    function dibujar(registros) {
      let html = "<table>";
      html += "<tr><th>Comisión</th>";

      TURNOS.forEach(t => {
        html +=`<th>${t}</th>`;
      });
      html += "</tr>";

      COMISIONES.forEach(comision => {
        html += `<tr><td>${comision}</td>`;

        TURNOS.forEach(turno => {
          const usados = registros.filter(x =>
            x.actividad === ACTIVIDAD &&
            x.comision === comision &&
            x.turno === turno
          ).length;

          html += "<td>";

          for (let i = 0; i < usados; i++) {
            html += "●<br>";
          }

          for (let i = usados; i < MAX_FAMILIAS; i++) {
            html += "○<br>";
          }

          if (usados < MAX_FAMILIAS) {
            html += `<button onclick="registrar('${comision}', '${turno}')">Inscribir</button>`;
          }

          html += "</td>";
        });

        html += "</tr>";
      });

      html += "</table>";
      document.getElementById("tabla").innerHTML = html;
    }

    async function registrar(comision, turno) {
      const familia = prompt("Ingrese familia");
      if (!familia) return;

      try {
        await fetch(API, {
          method: "POST",
          body: JSON.stringify({
            actividad: ACTIVIDAD,
            comision: comision,
            turno: turno,
            familia: familia
          })
        });
        cargar();
      } catch (error) {
        console.error("Error al registrar:", error);
      }
    }

    cargar();
  </script>
</body>
</html>
