<!DOCTYPE html>

<html>

 

<head>

 

<meta charset="UTF-8">

 

<title>Inscripción APAFA</title>

 

<style>

 

body{

font-family:Arial;

margin:20px;

}

 

table{

border-collapse:collapse;

width:100%;

}

 

th,td{

border:1px solid #ccc;

padding:8px;

}

 

button{

padding:5px 10px;

}

 

</style>

 

</head>

 

<body>

 

<h2>Inscripción de Familias</h2>

 

<div id="tabla"></div>

 

<script>

 

const API =

"https://script.google.com/macros/s/AKfycbwQVW4WVWYBTkYdg8SsbL-kTKXFlx6UQkwOtfzMCMbzFmHO97tn5KyK5CZdLlLuEW7z/exec";

 

const MAX_FAMILIAS = 3;

 

const ACTIVIDAD =

"Bingo";

 

const COMISIONES = [

"Seguridad",

"Caja",

"Tómbola",

"Comida"

];

 

const TURNOS = [

"09:00-12:00",

"12:00-15:00",

"15:00-18:00"

];

 

async function cargar(){

 

const respuesta =

await fetch(API);

 

const registros =

await respuesta.json();

 

dibujar(registros);

 

}

 

function dibujar(registros){

 

let html="<table>";

 

html+="<tr><th>Comisión</th>";

 

TURNOS.forEach(t=>{

 

html+=\`<th>${t}</th>\`;

 

});

 

html+="</tr>";

 

COMISIONES.forEach(comision=>{

 

html+=\`<tr><td>${comision}</td>\`;

 

TURNOS.forEach(turno=>{

 

let usados=

registros.filter(x=>

 

x.actividad===ACTIVIDAD &&

x.comision===comision &&

x.turno===turno

 

).length;

 

html+="<td>";

 

for(let i=0;i<usados;i++){

 

html+="●<br>";

 

}

 

for(let i=usados;i<MAX_FAMILIAS;i++){

 

html+="○<br>";

 

}

 

if(usados<MAX_FAMILIAS){

 

html+=\`

<button onclick="

registrar(

'${comision}',

'${turno}'

)">

Inscribir

</button>

\`;

 

}

 

html+="</td>";

 

});

 

html+="</tr>";

 

});

 

html+="</table>";

 

document.getElementById(

"tabla"

).innerHTML=html;

 

}

 

async function registrar(

comision,

turno

){

 

const familia =

prompt(

"Ingrese familia"

);

 

if(!familia)return;

 

await fetch(API,{

 

method:"POST",

 

body:JSON.stringify({

 

actividad:ACTIVIDAD,

 

comision:comision,

 

turno:turno,

 

familia:familia

 

})

 

});

 

cargar();

 

}

 

cargar();

 

</script>

 

</body>

 

</html>
